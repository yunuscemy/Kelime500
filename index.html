<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime500</title>
<meta name="description" content="Gizli Türkçe kelimeyi 8 hakta bul. Her gün üç zorluk için üç yeni kelime; serbest modda sınırsız oyna, arşivden eski günleri çöz.">
<link rel="stylesheet" href="assets/styles.css?v=21">
<script>
/* Tema ilk boyamadan once uygulanir; yoksa sabit yazili koyu tema bir an
   gorunup acik temaya gecerdi. Kayitli bir secim varsa o, yoksa cihazin
   tercihi kullanilir. Ayni mantik src/giris.js ve src/app.js icinde de var. */
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem('kelime500.tema')); } catch (e) { /* yoksay */ }
  if (t !== 'acik' && t !== 'koyu') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
      ? 'acik' : 'koyu';
  }
  document.documentElement.dataset.tema = t;
}());
</script>
</head>
<body class="giris">

<header>
  <div class="marka-kart">
    <span class="logo" aria-label="Kelime500">
      <span class="logo-kelime" aria-hidden="true"><b>K</b><b>E</b><b>L</b><b>İ</b><b>M</b><b>E</b></span>
      <span class="logo-sayi" aria-hidden="true"><b>5</b><b>0</b><b>0</b></span>
    </span>
    <button class="simge" id="tema" type="button" title="Gece/Gündüz">☀</button>
  </div>
</header>

<main class="giris-icerik">

  <section class="kart" id="nasil-kart">
    <p class="kart-ust">İlk kez mi buradasın?</p>
    <h2>Nasıl oynanır</h2>
    <button class="kart-dugme sari" id="yardim-ac" type="button">Kuralları oku →</button>
  </section>

  <section class="kart">
    <p class="kart-ust">Günde bir kez oyna</p>
    <h2>Günlük kelime</h2>
    <div class="durum-satiri" id="bugun-durum"></div>
    <a class="kart-dugme yesil" id="baglanti-gunluk" href="oyna.html?mod=gunluk">Oyna →</a>
  </section>

  <section class="kart">
    <p class="kart-ust">Sınırsız oyna</p>
    <h2>Serbest Mod</h2>
    <a class="kart-dugme yesil" id="baglanti-serbest" href="oyna.html?mod=serbest">Oyna →</a>
  </section>

  <section class="kart">
    <p class="kart-ust">Kaçırdığın günler</p>
    <h2>Arşiv</h2>
    <a class="kart-dugme yesil" id="baglanti-arsiv" href="oyna.html?mod=gunluk">Arşive git →</a>
  </section>

</main>

<p id="sayac" role="status"></p>

<script src="src/yardim.js?v=21"></script>
<script src="src/giris.js?v=21"></script>
</body>
</html>
