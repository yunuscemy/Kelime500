<script>
/* Tema ilk boyamadan once uygulanir; yoksa sabit yazili koyu tema bir an
   gorunup acik temaya gecerdi. Kayitli bir secim varsa o, yoksa cihazin
   tercihi kullanilir. Ayni mantik src/giris.js ve src/app.js icinde de var. */
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem('kelime500.tema')); } catch (e) { /* yoksay */ }
  if (t !== 'acik' && t !== 'koyu') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
      ? 'acik' : 'koyu';
  }
  document.documentElement.dataset.tema = t;

  /* Reklam yuvasi onizlemesi: ?reklam=1 ile acilir, ?reklam=0 ile kapanir.
     Sekme oturumu boyunca hatirlanir, boylece sayfalar arasi gezinirken
     kaybolmaz. Ziyaretciler normal adreste bos yuvalari gormez. */
  try {
    if (/[?&]reklam=1/.test(location.search)) {
      sessionStorage.setItem('kelime500.reklamOnizleme', '1');
    } else if (/[?&]reklam=0/.test(location.search)) {
      sessionStorage.removeItem('kelime500.reklamOnizleme');
    }
    if (sessionStorage.getItem('kelime500.reklamOnizleme')) {
      document.documentElement.dataset.reklam = 'onizleme';
    }
  } catch (e) { /* yoksay */ }
}());
</script>
