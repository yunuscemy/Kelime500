<!doctype html>
<html lang="tr" data-tema="koyu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kelime500</title>
<meta name="description" content="Gizli Türkçe kelimeyi 8 hakta bul. Her tahminde kaç harfin doğru yerde, kaç harfin yanlış yerde, kaç harfin kelimede hiç olmadığını öğrenirsin — hangileri olduğunu değil.">
<link rel="stylesheet" href="assets/styles.css?v=21">
<script>
/* Tema ilk boyamadan once uygulanir; yoksa sabit yazili koyu tema bir an
   gorunup acik temaya gecerdi. Kayitli bir secim varsa o, yoksa cihazin
   tercihi kullanilir. Ayni mantik src/giris.js ve src/app.js icinde de var. */
(function () {
  var t = null;
  try { t = JSON.parse(localStorage.getItem('kelime500.tema')); } catch (e) { /* yoksay */ }
  if (t !== 'acik' && t !== 'koyu') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches
      ? 'acik' : 'koyu';
  }
  document.documentElement.dataset.tema = t;
}());
</script>
</head>
<body>

<header>
  <span class="logo" aria-label="Kelime500">
    <span class="logo-kelime" aria-hidden="true"><b>K</b><b>E</b><b>L</b><b>İ</b><b>M</b><b>E</b></span>
    <span class="logo-sayi" aria-hidden="true"><b>5</b><b>0</b><b>0</b></span>
  </span>

  <button class="simge zorluk-dugme" id="zorluk-dugme" type="button"></button>

  <div class="acilir-sarmal">
    <button class="simge" id="menu-dugme" type="button"
            aria-haspopup="true" aria-expanded="false" title="Menü">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <div class="acilir" id="ana-menu" hidden role="menu">
      <button type="button" role="menuitem" data-mod="gunluk">Günlük</button>
      <button type="button" role="menuitem" data-mod="serbest">Serbest Mod</button>
      <button type="button" role="menuitem" data-mod="arsiv">Arşiv</button>
      <hr id="menu-ayrac">
      <button type="button" role="menuitem" id="menu-yeni">Yeni kelime</button>
      <button type="button" role="menuitem" id="menu-istatistik">İstatistik</button>
      <button type="button" role="menuitem" id="menu-yardim">Nasıl oynanır?</button>
      <button type="button" role="menuitem" id="menu-tema">Gece/Gündüz</button>
    </div>
  </div>

  <a class="simge" href="index.html" title="Ana sayfa">←</a>
</header>

<div class="kontroller" id="kontroller">
  <span class="mod-etiket" id="mod-etiket"></span>
</div>

<div class="tarih-nav" id="tarih-nav">
  <button class="simge" id="onceki" type="button" title="Önceki gün">‹</button>
  <input type="date" id="tarih" title="Arşiv: eski günleri oyna">
  <button class="simge" id="sonraki" type="button" title="Sonraki gün">›</button>
</div>

<p id="hata" hidden></p>

<main>
  <div id="tahta"></div>
  <div id="klavye"></div>
</main>

<div id="bildirim" role="status" aria-live="polite"></div>



<dialog id="ist-pencere">
  <button class="simge kapat" type="button">✕</button>
  <h2>İstatistikler</h2>
  <p id="ist-baslik" style="margin:0"></p>
  <div class="istatistikler" id="ist-ozet"></div>
  <p style="margin:0 0 4px"><b>Kaç hakta bildin</b></p>
  <div class="dagilim" id="ist-dagilim"></div>
  <button class="tus genis" id="ist-paylas" type="button" style="width:100%;margin-top:14px;height:40px">
    Sonucu kopyala
  </button>
  <span id="geri-sayim"></span>
</dialog>

<script src="src/yardim.js?v=21"></script>
<script src="src/turkish.js?v=21"></script>
<script src="src/engine.js?v=21"></script>
<script src="src/sozluk.js?v=21"></script>
<script src="src/words.js?v=21"></script>
<script src="src/app.js?v=21"></script>
</body>
</html>
